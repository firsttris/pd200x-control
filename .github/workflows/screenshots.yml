name: Update screenshots

# Takes the pictures in docs/ (README, documentation, banner, social preview) from the demo data
# with scripts/screenshots.sh and commits the ones that changed. Run it after a change to the look.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The Playwright image has Node and npm but no unzip for setup-bun; the Bun of packageManager
      install: >-
        npm install --global "bun@$(node -p "require('./app/package.json').packageManager.split('@')[1]")"
        && bun install --cwd app --frozen-lockfile
      lockfile: app/bun.lock
      command: bash scripts/screenshots.sh
      paths: |
        docs/screenshot-*.png
        docs/social-preview.png
        docs/banner.png
    permissions:
      contents: write
