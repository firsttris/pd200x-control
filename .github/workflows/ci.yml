name: CI

on:
  push:
    branches: [main]            # not every branch, pull requests build through pull_request
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:                # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust · fmt, clippy, unit + integration tests
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # From the Actions cache: the Ubuntu mirror is sometimes slow
      - name: System packages (Tauri)
        uses: firsttris/workflows/actions/apt-install@main
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          recommends: "false"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p app/dist && echo '<!doctype html>' > app/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Includes the bindings check: fails if app/src/lib/bindings.ts is outdated.
      - run: cargo test --workspace

  frontend:
    name: Frontend · lint, typecheck, unit + component tests, build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run coverage
      - run: bun run build

  playwright-image:
    name: Frontend · Playwright image
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.version.outputs.image }}
    steps:
      - id: version
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: app/bun.lock

  e2e:
    name: Frontend · Playwright E2E (Chromium, WebKit)
    needs: playwright-image
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # The official image of the @playwright/test version in the lockfile: browsers, their libraries
    # and fonts are in it, so no playwright install runs and every run sees the same browser.
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      # The npm package brings the binary without curl or unzip, which the image lacks; the
      # version is `packageManager` in app/package.json, as setup-bun takes it elsewhere
      - run: npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
      - run: bun install --frozen-lockfile
      - run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
