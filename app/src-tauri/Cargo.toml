[package]
name = "pd200x-control"
description = "pd200x-control – control the Maono PD200X/PD200XS microphone on Linux (desktop app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "pd200x_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pd200x-control"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pd200x-core = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-single-instance = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }
