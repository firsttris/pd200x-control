# Documentation as a website: https://firsttris.github.io/pd200x-control/
# Source is docs/, built with MkDocs Material (.github/workflows/docs.yml).
# Locally: just docs (or pip install -r requirements-docs.txt && mkdocs serve)
site_name: pd200x-control
site_description: >-
  Linux app for the Maono PD200X and PD200XS USB microphone: gain, headphone monitoring,
  noise cancellation, EQ, compressor, limiter and the RGB ring light, a live level meter,
  a test recording and a level finder for quiet dynamic microphones. Desktop app and CLI,
  written in Rust.
site_url: https://firsttris.github.io/pd200x-control/
repo_url: https://github.com/firsttris/pd200x-control
repo_name: firsttris/pd200x-control
edit_uri: edit/main/docs/
copyright: License GPL-3.0 · © Tristan Teufel and contributors

docs_dir: docs
# Pages as app.html instead of app/: keeps the relative image paths right,
# which also have to work on GitHub
use_directory_urls: false
exclude_docs: |
  social-preview.png
  banner.png
validation:
  anchors: warn

nav:
  - Overview: README.md
  - Installation: installation.md
  - Using it:
      - The app: app.md
      - A quiet microphone: quiet-microphone.md
      - Command line: command-line.md
      - FAQ and troubleshooting: faq.md
  - How it works: how-it-works.md
  - Development: development.md

theme:
  name: material
  language: en
  logo: assets/icon.svg
  favicon: assets/icon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      type: date
      locale: en
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/firsttris/pd200x-control
      name: Source on GitHub
    - icon: material/download
      link: https://github.com/firsttris/pd200x-control/releases/latest
      name: Latest release
